name: Haven CI

on:
  push:
    branches: [main]
    paths:
      - 'dev/kid/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dev/kid/**'

jobs:
  lint-and-test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/kid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('dev/kid/requirements-ci.txt') }}

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Ruff check
        run: ruff check .

      - name: Pytest
        run: python -m pytest tests/ -q --tb=short
