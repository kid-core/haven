<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" style="background:#111827;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#818cf8"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4c1d95"/><stop offset="100%" stop-color="#2e1065"/></linearGradient>
    <linearGradient id="sys" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
  </defs>

  <!-- Title -->
  <text x="800" y="42" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="bold">Haven Agent v0.1 系統架構圖</text>
  <text x="800" y="66" text-anchor="middle" fill="#818cf8" font-size="13">有向無環圖（DAG）· 零循環依賴 · 702 項測試全部通過</text>

  <!-- haven.py 主入口 -->
  <rect x="600" y="90" width="400" height="50" rx="10" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
  <text x="800" y="120" text-anchor="middle" fill="#c7d2fe" font-size="16" font-weight="bold">haven.py（主入口 · 互動 / 單次 / 背景）</text>

  <!-- 箭頭到三個獨立島 -->
  <line x1="700" y1="140" x2="250" y2="185" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="800" y1="140" x2="800" y2="185" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="900" y1="140" x2="1350" y2="185" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 第二層：三個獨立島 -->
  <rect x="60" y="190" width="380" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="250" y="215" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="bold">🖼 系統化身（Avatar）</text>
  <text x="250" y="238" text-anchor="middle" fill="#34d399" font-size="11">獨立島 · 5 項數值 · 7 種姿態 · ASCII 渲染</text>

  <rect x="520" y="190" width="560" height="60" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="800" y="215" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="bold">📦 lib/ 共享函式庫</text>
  <text x="800" y="238" text-anchor="middle" fill="#6366f1" font-size="11">斷路器（CircuitBreaker）· 設定管理（Config）· 結構化日誌（Logger）</text>

  <rect x="1160" y="190" width="380" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="1350" y="215" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="bold">🧠 KAIROS 記憶系統</text>
  <text x="1350" y="238" text-anchor="middle" fill="#34d399" font-size="11">獨立島 · 3 層閘門 · 附加式日誌 · 記憶鞏固</text>

  <!-- 箭頭到 tool_base -->
  <line x1="800" y1="250" x2="800" y2="295" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 第三層：tool_base -->
  <rect x="550" y="300" width="500" height="50" rx="8" fill="#451a03" stroke="#d97706" stroke-width="2"/>
  <text x="800" y="322" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="bold">tool_base（Tool 基底抽象類別）</text>
  <text x="800" y="340" text-anchor="middle" fill="#b45309" font-size="11">唯一全局依賴 · name · 是否唯讀 · 是否破壞性 · 延遲載入</text>

  <!-- 箭頭到 AgentLoop -->
  <line x1="800" y1="350" x2="800" y2="405" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 從工具到 AgentLoop -->
  <line x1="220" y1="325" x2="480" y2="415" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1380" y1="325" x2="1120" y2="415" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 第四層：AgentLoop 中心樞紐 + 週邊工具 -->
  <rect x="40" y="380" width="360" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="220" y="404" text-anchor="middle" fill="#94a3b8" font-size="14">📧 MailTool + 🔍 ScanTool</text>
  <text x="220" y="422" text-anchor="middle" fill="#64748b" font-size="10">包裝層 · 匯入快取 · 不修改原始檔案</text>

  <rect x="480" y="410" width="640" height="65" rx="12" fill="url(#hub)" stroke="#8b5cf6" stroke-width="3"/>
  <text x="800" y="438" text-anchor="middle" fill="#e9d5ff" font-size="20" font-weight="bold">🔄 AgentLoop（唯一中心樞紐）</text>
  <text x="800" y="460" text-anchor="middle" fill="#a78bfa" font-size="12">5 階段生成器 · 暫停 / 恢復 · 最大輪次 = 100 · 斷路器保護</text>

  <rect x="1200" y="380" width="340" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="1370" y="404" text-anchor="middle" fill="#94a3b8" font-size="14">🔧 ToolSearch（延遲載入）</text>
  <text x="1370" y="422" text-anchor="middle" fill="#64748b" font-size="10">按需搜尋 · 模糊匹配 · 不分大小寫</text>

  <!-- 從 AgentLoop 到三個子系統 -->
  <line x1="620" y1="475" x2="250" y2="550" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="475" x2="700" y2="550" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="800" y1="475" x2="800" y2="550" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="980" y1="475" x2="1370" y2="550" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 第五層：三個子系統 -->
  <rect x="40" y="555" width="420" height="80" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="580" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="bold">🔒 權限管理器（Permission）</text>
  <text x="250" y="600" text-anchor="middle" fill="#60a5fa" font-size="11">3 層檢查：規則（O(1)）→ 勾點（可程式化）→ 預設拒絕</text>
  <text x="250" y="620" text-anchor="middle" fill="#60a5fa" font-size="11">+ 拒絕追蹤器（CC 46 行設計）· 連續 3 次拒絕自動降級</text>

  <rect x="510" y="555" width="380" height="80" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="700" y="580" text-anchor="middle" fill="#5eead4" font-size="15" font-weight="bold">📐 壓縮管道（Compaction）</text>
  <text x="700" y="600" text-anchor="middle" fill="#2dd4bf" font-size="11">第1級：截斷（O(1)）→ 第2級：清理（O(n)）→ 第3級：摘要（API）</text>
  <text x="700" y="620" text-anchor="middle" fill="#2dd4bf" font-size="11">斷路器保護（最多3次失敗）· 便宜先做 · 夠用就停</text>

  <rect x="940" y="555" width="600" height="80" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1240" y="580" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="bold">🧪 驗證代理（Verification Agent）</text>
  <text x="1240" y="600" text-anchor="middle" fill="#8b5cf6" font-size="11">「AI 不相信自己」· 3 層驗證：靜態分析 → 危險模式 → AI 分析</text>
  <text x="1240" y="620" text-anchor="middle" fill="#8b5cf6" font-size="11">內建合理化藉口清單 ·「程式碼看起來是對的」→ 讀不等於驗證</text>

  <!-- 五階段處理管道 -->
  <rect x="20" y="670" width="1560" height="95" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="800" y="695" text-anchor="middle" fill="#818cf8" font-size="14" font-weight="bold">五階段處理管道</text>

  <rect x="50" y="712" width="120" height="36" rx="6" fill="#1e3a5f"/>
  <text x="110" y="736" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">輸入</text>

  <rect x="190" y="712" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="295" y="736" text-anchor="middle" fill="#cbd5e1" font-size="12">1. 壓縮（3級+斷路器）</text>

  <rect x="420" y="712" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="525" y="736" text-anchor="middle" fill="#cbd5e1" font-size="12">2. 思考（MockModel）</text>

  <rect x="650" y="712" width="210" height="36" rx="6" fill="#451a03"/>
  <text x="755" y="736" text-anchor="middle" fill="#fcd34d" font-size="12">3. 檢查（3層權限）</text>

  <rect x="880" y="712" width="230" height="36" rx="6" fill="#064e3b"/>
  <text x="995" y="736" text-anchor="middle" fill="#6ee7b7" font-size="12">4. 執行（斷路器保護）</text>

  <rect x="1130" y="712" width="250" height="36" rx="6" fill="#1e1b4b"/>
  <text x="1255" y="736" text-anchor="middle" fill="#c4b5fd" font-size="12">5. 處理（含驗證代理）</text>

  <rect x="1400" y="712" width="120" height="36" rx="6" fill="#1e3a5f"/>
  <text x="1460" y="736" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">輸出</text>

  <!-- 階段間箭頭 -->
  <line x1="170" y1="730" x2="185" y2="730" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="730" x2="415" y2="730" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="630" y1="730" x2="645" y2="730" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="860" y1="730" x2="875" y2="730" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1110" y1="730" x2="1125" y2="730" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1380" y1="730" x2="1395" y2="730" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 統計 -->
  <rect x="200" y="790" width="1200" height="44" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <text x="800" y="810" text-anchor="middle" fill="#64748b" font-size="12">
    原始碼 3080 行 · 23 個檔案 · 702 項測試 · 0 失敗 · 零循環依賴
  </text>
  <text x="800" y="826" text-anchor="middle" fill="#475569" font-size="10">
    core/ · permissions/ · compaction/ · tools/ · memory/ · avatar/ · lib/
  </text>

  <!-- 圖例 -->
  <rect x="20" y="850" width="1560" height="65" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <text x="46" y="878" fill="#818cf8" font-size="11">圖例：</text>
  <rect x="100" y="868" width="18" height="12" rx="3" fill="#4c1d95" stroke="#8b5cf6"/>
  <text x="126" y="879" fill="#94a3b8" font-size="10">中心樞紐</text>
  <rect x="206" y="868" width="18" height="12" rx="3" fill="#064e3b" stroke="#10b981" stroke-dasharray="4,2"/>
  <text x="232" y="879" fill="#94a3b8" font-size="10">獨立島</text>
  <rect x="296" y="868" width="18" height="12" rx="3" fill="#451a03" stroke="#d97706"/>
  <text x="322" y="879" fill="#94a3b8" font-size="10">全局依賴</text>
  <rect x="406" y="868" width="18" height="12" rx="3" fill="#1e293b" stroke="#475569"/>
  <text x="432" y="879" fill="#94a3b8" font-size="10">工具包裝</text>
  <rect x="516" y="868" width="18" height="12" rx="3" fill="#0f172a" stroke="#3b82f6"/>
  <text x="542" y="879" fill="#94a3b8" font-size="10">子系統</text>
  <rect x="626" y="868" width="18" height="12" rx="3" fill="#1e1b4b" stroke="#818cf8" stroke-dasharray="4,2"/>
  <text x="652" y="879" fill="#94a3b8" font-size="10">共享函式庫</text>

  <text x="800" y="908" text-anchor="middle" fill="#334155" font-size="10">設計：KID · 靈感來源：Claude Code 源碼洩漏分析 · 2026-06-08</text>
</svg>
