<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" style="background:#1a1a2e;font-family:system-ui,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7b8abc"/>
    </marker>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2a3a6e"/><stop offset="100%" stop-color="#1e2a4a"/></linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3a2a6e"/><stop offset="100%" stop-color="#2a1e4a"/></linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2a6e5a"/><stop offset="100%" stop-color="#1e4a3a"/></linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6e5a2a"/><stop offset="100%" stop-color="#4a3a1e"/></linearGradient>
  </defs>

  <!-- Title -->
  <text x="800" y="45" text-anchor="middle" fill="#e0e0f0" font-size="28" font-weight="bold">Haven Agent v0.1 — System Architecture</text>
  <text x="800" y="70" text-anchor="middle" fill="#7b8abc" font-size="14">DAG Structure · Zero Cyclic Dependencies · 702 Tests</text>

  <!-- haven.py -->
  <rect x="650" y="95" width="300" height="50" rx="10" fill="#2a3a6e" stroke="#4a6abe" stroke-width="2"/>
  <text x="800" y="126" text-anchor="middle" fill="#c0d0ff" font-size="18" font-weight="bold">haven.py</text>

  <!-- Arrows from haven.py to 3 islands -->
  <line x1="700" y1="145" x2="280" y2="190" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="145" x2="800" y2="190" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="145" x2="1320" y2="190" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Independent Islands -->
  <rect x="100" y="195" width="360" height="55" rx="8" fill="#1e3a1e" stroke="#3a6e3a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="280" y="218" text-anchor="middle" fill="#90ff90" font-size="14" font-weight="bold">Avatar (系統化身)</text>
  <text x="280" y="238" text-anchor="middle" fill="#6a9a6a" font-size="11">獨立島 · 5 stats · 7 poses · ASCII</text>

  <rect x="580" y="195" width="440" height="55" rx="8" fill="#2a2a4a" stroke="#5a5a7a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="800" y="218" text-anchor="middle" fill="#c0a0ff" font-size="14" font-weight="bold">lib/ — 共享函式庫</text>
  <text x="800" y="238" text-anchor="middle" fill="#8a6aaa" font-size="11">CircuitBreaker · Config · Logger</text>

  <rect x="1140" y="195" width="360" height="55" rx="8" fill="#1e3a1e" stroke="#3a6e3a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="1320" y="218" text-anchor="middle" fill="#90ff90" font-size="14" font-weight="bold">Kairos Memory (記憶系統)</text>
  <text x="1320" y="238" text-anchor="middle" fill="#6a9a6a" font-size="11">獨立島 · 3層閘門 · append-only logs</text>

  <!-- Arrow to tool_base -->
  <line x1="800" y1="250" x2="800" y2="300" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: tool_base -->
  <rect x="600" y="305" width="400" height="45" rx="8" fill="#3a2a2a" stroke="#6e4a3a" stroke-width="2"/>
  <text x="800" y="328" text-anchor="middle" fill="#ffc0a0" font-size="15" font-weight="bold">tool_base (BaseTool ABC)</text>
  <text x="800" y="342" text-anchor="middle" fill="#aa9070" font-size="10">唯一全局依賴 · name · readOnly · destructive · deferred</text>

  <!-- Arrow to AgentLoop -->
  <line x1="800" y1="350" x2="800" y2="410" stroke="#7b8abc" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrows from tools to AgentLoop -->
  <line x1="240" y1="330" x2="550" y2="415" stroke="#6a5a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1370" y1="330" x2="1050" y2="415" stroke="#6a5a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 4: AgentLoop (hub) + tools -->
  <rect x="100" y="380" width="280" height="45" rx="8" fill="#2a3a5a" stroke="#4a6a8a" stroke-width="1.5"/>
  <text x="240" y="404" text-anchor="middle" fill="#a0c0ff" font-size="14">MailTool + ScanTool</text>
  <text x="240" y="418" text-anchor="middle" fill="#6a8aaa" font-size="10">wrapper · import cache · 不修改原始檔</text>

  <rect x="550" y="415" width="500" height="60" rx="12" fill="#4a2a6e" stroke="#7a4abe" stroke-width="3"/>
  <text x="800" y="440" text-anchor="middle" fill="#e0c0ff" font-size="20" font-weight="bold">AgentLoop (唯一 Hub)</text>
  <text x="800" y="460" text-anchor="middle" fill="#a080c0" font-size="12">5-stage generator · dump_state/resume · max_turns=100</text>

  <rect x="1200" y="380" width="300" height="45" rx="8" fill="#2a3a5a" stroke="#4a6a8a" stroke-width="1.5"/>
  <text x="1350" y="404" text-anchor="middle" fill="#a0c0ff" font-size="14">ToolSearch (延遲載入)</text>
  <text x="1350" y="418" text-anchor="middle" fill="#6a8aaa" font-size="10">deferred tools · fuzzy match · on-demand</text>

  <!-- Arrows FROM AgentLoop to subsystems -->
  <line x1="630" y1="475" x2="280" y2="560" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="475" x2="700" y2="560" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="475" x2="900" y2="560" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="475" x2="1350" y2="560" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 5: Subsystems -->
  <rect x="80" y="565" width="400" height="70" rx="8" fill="#1e2a4a" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="280" y="590" text-anchor="middle" fill="#c0d0ff" font-size="15" font-weight="bold">Permission Manager</text>
  <text x="280" y="608" text-anchor="middle" fill="#8aaaee" font-size="11">3層檢查：規則(O(1)) → Hook → Default-Deny</text>
  <text x="280" y="626" text-anchor="middle" fill="#8aaaee" font-size="11">+ DenialTracker (CC 46行) · 連續3次拒絕降級</text>

  <rect x="530" y="565" width="340" height="70" rx="8" fill="#1e3a2a" stroke="#3a6e4a" stroke-width="1.5"/>
  <text x="700" y="590" text-anchor="middle" fill="#c0ffd0" font-size="15" font-weight="bold">Compaction Pipeline</text>
  <text x="700" y="608" text-anchor="middle" fill="#8aeeaa" font-size="11">L1截斷(O(1)) → L2清理(O(n)) → L3摘要(API)</text>
  <text x="700" y="626" text-anchor="middle" fill="#8aeeaa" font-size="11">CircuitBreaker (max 3) · 便宜先做，夠用就停</text>

  <rect x="920" y="565" width="600" height="70" rx="8" fill="#2a1e3a" stroke="#6e3a5a" stroke-width="1.5"/>
  <text x="1220" y="590" text-anchor="middle" fill="#f0c0ff" font-size="15" font-weight="bold">Verification Agent</text>
  <text x="1220" y="608" text-anchor="middle" fill="#cc8aee" font-size="11">「AI 不相信 AI」 · 3層驗證：靜態→危險模式→AI</text>
  <text x="1220" y="626" text-anchor="middle" fill="#cc8aee" font-size="11">內建合理化藉口清單 · 「大概沒問題」→ 大概≠已驗證</text>

  <!-- Pipeline Flow Bar -->
  <rect x="30" y="680" width="1540" height="80" rx="10" fill="#1a1a30" stroke="#3a3a5a" stroke-width="1"/>
  <text x="800" y="705" text-anchor="middle" fill="#7b8abc" font-size="14" font-weight="bold">5-Stage Processing Pipeline</text>

  <!-- Stage boxes -->
  <rect x="55" y="720" width="130" height="30" rx="6" fill="#2a4a6e"/>
  <text x="120" y="740" text-anchor="middle" fill="#d0e0ff" font-size="12" font-weight="bold">Input</text>

  <rect x="200" y="720" width="190" height="30" rx="6" fill="#2a3a5e"/>
  <text x="295" y="740" text-anchor="middle" fill="#d0d0ff" font-size="12">1. Compacting (3-level+CB)</text>

  <rect x="405" y="720" width="190" height="30" rx="6" fill="#2a3a5e"/>
  <text x="500" y="740" text-anchor="middle" fill="#d0d0ff" font-size="12">2. Thinking (MockModel)</text>

  <rect x="610" y="720" width="190" height="30" rx="6" fill="#4a3a1e"/>
  <text x="705" y="740" text-anchor="middle" fill="#ffd0a0" font-size="12">3. Checking (3-layer)</text>

  <rect x="815" y="720" width="200" height="30" rx="6" fill="#3a4a1e"/>
  <text x="915" y="740" text-anchor="middle" fill="#d0ffa0" font-size="12">4. Executing (CB protected)</text>

  <rect x="1030" y="720" width="220" height="30" rx="6" fill="#3a2a5e"/>
  <text x="1140" y="740" text-anchor="middle" fill="#e0d0ff" font-size="12">5. Processing (+Verification)</text>

  <rect x="1265" y="720" width="130" height="30" rx="6" fill="#2a4a6e"/>
  <text x="1330" y="740" text-anchor="middle" fill="#d0e0ff" font-size="12" font-weight="bold">Output</text>

  <!-- Arrows between stages -->
  <line x1="185" y1="735" x2="200" y2="735" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="735" x2="405" y2="735" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="595" y1="735" x2="610" y2="735" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="735" x2="815" y2="735" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1015" y1="735" x2="1030" y2="735" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1250" y1="735" x2="1265" y2="735" stroke="#7b8abc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stats footer -->
  <rect x="300" y="790" width="1000" height="45" rx="8" fill="#0a0a1e" stroke="#2a2a4a" stroke-width="1"/>
  <text x="800" y="810" text-anchor="middle" fill="#6a6aaa" font-size="12">
    3080 lines · 23 source files · 702 tests · 0 failures · Zero cyclic dependencies · Modularity 8/10
  </text>
  <text x="800" y="826" text-anchor="middle" fill="#4a4a7a" font-size="10">
    core/ · permissions/ · compaction/ · tools/ · memory/ · avatar/ · lib/
  </text>

  <!-- Legend -->
  <rect x="30" y="850" width="1540" height="60" rx="8" fill="#0a0a1e" stroke="#2a2a4a" stroke-width="1"/>
  <text x="50" y="875" fill="#7b8abc" font-size="11">Legend:</text>
  <rect x="120" y="862" width="20" height="12" rx="3" fill="#4a2a6e" stroke="#7a4abe"/>
  <text x="148" y="873" fill="#8a8aaa" font-size="10">Central Hub</text>
  <rect x="230" y="862" width="20" height="12" rx="3" fill="#1e3a1e" stroke="#3a6e3a" stroke-dasharray="4,2"/>
  <text x="258" y="873" fill="#8a8aaa" font-size="10">Independent Island</text>
  <rect x="360" y="862" width="20" height="12" rx="3" fill="#3a2a2a" stroke="#6e4a3a"/>
  <text x="388" y="873" fill="#8a8aaa" font-size="10">Global Dependency</text>
  <rect x="520" y="862" width="20" height="12" rx="3" fill="#2a3a5a" stroke="#4a6a8a"/>
  <text x="548" y="873" fill="#8a8aaa" font-size="10">Tool Wrapper</text>
  <rect x="650" y="862" width="20" height="12" rx="3" fill="#1e2a4a" stroke="#3a4a6e"/>
  <text x="678" y="873" fill="#8a8aaa" font-size="10">Subsystem</text>

  <text x="800" y="900" text-anchor="middle" fill="#4a4a6a" font-size="10">Designed by KID · Inspired by Claude Code Source Leak Analysis · 2026-06-08</text>
</svg>
