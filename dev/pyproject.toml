[tool.pytest.ini_options]
testpaths = ["kid/tests"]
pythonpath = ["kid"]
asyncio_mode = "auto"
markers = [
    "unit: Pure logic tests, no dependencies (CI default)",
    "component: Multi-unit tests with mocked dependencies (CI default)",
    "integration: Tests using real LLM APIs (skip in CI)",
    "slow: Tests that take >5 seconds (skip in CI)",
    "security: Security boundary tests",
    "persistence: Tests covering crash recovery",
]

